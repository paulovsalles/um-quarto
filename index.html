<!-- PATCH UM QUARTO — TELA INICIAL + LOGIN MAIS LIMPOS
Cole este bloco antes de </body>. Ele reconstrói apenas a área #login-screen.
Não mexe no app-shell nem nas funções do Firebase já existentes.
-->

<style id="uq-landing-login-patch-css">
  /* ===== UM QUARTO: LANDING / LOGIN PATCH ===== */
  #login-screen.uq-public-screen{
    min-height:100vh;
    width:100%;
    padding:0 !important;
    display:flex;
    flex-direction:column;
    align-items:stretch;
    justify-content:flex-start;
    background:
      radial-gradient(circle at 20% 0%, rgba(35,184,166,.14), transparent 34%),
      radial-gradient(circle at 85% 10%, rgba(40,71,84,.12), transparent 30%),
      var(--bg, #f4f6fb);
    color:var(--tx, #1a1f2e);
    overflow-x:hidden;
  }

  body.dark #login-screen.uq-public-screen{
    background:
      radial-gradient(circle at 20% 0%, rgba(45,212,191,.14), transparent 34%),
      radial-gradient(circle at 85% 10%, rgba(96,165,250,.10), transparent 30%),
      var(--bg, #0c0e14);
  }

  .uq-public-wrap{
    width:min(1120px, calc(100% - 40px));
    margin:0 auto;
  }

  .uq-public-navbar{
    height:72px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
  }

  .uq-brand{
    border:0;
    background:transparent;
    color:var(--tx, #1a1f2e);
    font-family:'Space Grotesk', 'Inter', sans-serif;
    font-weight:800;
    font-size:23px;
    letter-spacing:-.04em;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:8px 0;
  }

  .uq-brand-dot{
    width:11px;
    height:11px;
    border-radius:4px;
    background:var(--teal, #23B8A6);
    box-shadow:0 0 0 6px rgba(35,184,166,.10);
  }

  .uq-brand span{
    color:var(--teal, #23B8A6);
  }

  .uq-nav-links{
    display:flex;
    align-items:center;
    gap:18px;
    font-size:13px;
    color:var(--mu, #5a6480);
  }

  .uq-nav-link{
    color:inherit;
    text-decoration:none;
    cursor:pointer;
    transition:.18s ease;
  }

  .uq-nav-link:hover{
    color:var(--teal, #23B8A6);
  }

  .uq-access-btn{
    border:1px solid var(--bd2, rgba(0,0,0,.14));
    background:var(--s1, #fff);
    color:var(--tx, #1a1f2e);
    border-radius:999px;
    height:38px;
    padding:0 16px;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
    box-shadow:0 10px 24px rgba(0,0,0,.05);
    transition:.18s ease;
  }

  .uq-access-btn:hover{
    transform:translateY(-1px);
    border-color:var(--tbd, rgba(35,184,166,.35));
    color:var(--teal, #23B8A6);
  }

  .uq-hero{
    min-height:calc(100vh - 72px);
    display:grid;
    place-items:center;
    padding:48px 0 72px;
  }

  .uq-hero-inner{
    width:min(760px, 100%);
    margin:0 auto;
    text-align:center;
  }

  .uq-eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    border:1px solid var(--tbd, rgba(35,184,166,.35));
    background:var(--tbg, rgba(35,184,166,.10));
    color:var(--teal, #23B8A6);
    border-radius:999px;
    padding:7px 12px;
    font-size:11px;
    font-weight:800;
    letter-spacing:.08em;
    text-transform:uppercase;
    margin-bottom:18px;
  }

  .uq-logo-title{
    font-family:'Space Grotesk', 'Inter', sans-serif;
    font-weight:900;
    letter-spacing:-.07em;
    font-size:clamp(54px, 9vw, 92px);
    line-height:.92;
    color:var(--tx, #1a1f2e);
    margin-bottom:14px;
  }

  .uq-logo-title span{
    color:var(--teal, #23B8A6);
  }

  .uq-hero-subtitle{
    font-family:'Space Grotesk', 'Inter', sans-serif;
    font-size:clamp(20px, 3.2vw, 30px);
    line-height:1.12;
    letter-spacing:-.045em;
    font-weight:800;
    color:var(--tx, #1a1f2e);
    margin:0 auto 12px;
  }

  .uq-hero-text{
    max-width:560px;
    margin:0 auto 30px;
    color:var(--mu, #5a6480);
    font-size:15px;
    line-height:1.65;
  }

  .uq-main-cta{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:210px;
    height:48px;
    border:0;
    border-radius:999px;
    background:var(--teal, #23B8A6);
    color:#081311;
    font-size:15px;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 18px 42px rgba(35,184,166,.27);
    transition:.18s ease;
  }

  .uq-main-cta:hover{
    transform:translateY(-2px);
    filter:saturate(1.05);
  }

  .uq-student-note{
    position:fixed;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    width:min(560px, calc(100% - 32px));
    text-align:center;
    font-size:12px;
    color:var(--di, #9aa0b4);
    pointer-events:none;
  }

  .uq-auth-shell{
    min-height:100vh;
    display:none;
    flex-direction:column;
  }

  .uq-auth-shell.active{
    display:flex;
  }

  .uq-auth-top{
    height:72px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }

  .uq-auth-body{
    flex:1;
    display:grid;
    place-items:center;
    padding:28px 0 64px;
  }

  .uq-login-card{
    width:min(410px, 100%);
    background:var(--s1, #fff);
    border:1px solid var(--bd, rgba(0,0,0,.08));
    border-radius:26px;
    padding:26px;
    box-shadow:0 24px 70px rgba(0,0,0,.12);
  }

  body.dark .uq-login-card{
    box-shadow:0 24px 70px rgba(0,0,0,.42);
  }

  .uq-login-title{
    font-family:'Space Grotesk', 'Inter', sans-serif;
    font-weight:900;
    letter-spacing:-.04em;
    font-size:28px;
    line-height:1.05;
    text-align:center;
    margin-bottom:6px;
  }

  .uq-login-sub{
    text-align:center;
    color:var(--mu, #5a6480);
    font-size:13px;
    margin-bottom:18px;
  }

  .login-tabs{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:6px;
    padding:4px;
    border-radius:14px;
    background:var(--s2, #f0f2f8);
    margin-bottom:16px;
  }

  .login-tab-btn{
    border:0;
    background:transparent;
    color:var(--mu, #5a6480);
    border-radius:11px;
    height:34px;
    font-size:12px;
    font-weight:800;
    cursor:pointer;
    transition:.16s ease;
  }

  .login-tab-btn.active{
    background:var(--s1, #fff);
    color:var(--teal, #23B8A6);
    box-shadow:0 8px 20px rgba(0,0,0,.06);
  }

  .login-input-wrap{
    min-height:44px;
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--s2, #f0f2f8);
    border:1px solid var(--bd, rgba(0,0,0,.08));
    border-radius:13px;
    padding:0 12px;
    margin-bottom:10px;
  }

  .login-input-icon{
    font-size:14px;
    opacity:.8;
  }

  .login-input{
    width:100%;
    border:0;
    outline:0;
    background:transparent;
    color:var(--tx, #1a1f2e);
    font:600 14px 'Inter', sans-serif;
    height:42px;
  }

  .login-input::placeholder{
    color:var(--di, #9aa0b4);
    font-weight:500;
  }

  .login-btn-action,
  .login-btn-google{
    width:100%;
    min-height:43px;
    border-radius:13px;
    border:1px solid var(--bd2, rgba(0,0,0,.14));
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    font-size:13px;
    font-weight:900;
    cursor:pointer;
    transition:.16s ease;
  }

  .login-btn-action:hover,
  .login-btn-google:hover{
    transform:translateY(-1px);
  }

  .login-btn-google{
    background:var(--s2, #f0f2f8);
    color:var(--tx, #1a1f2e);
  }

  .login-link{
    text-align:center;
    font-size:12px;
    color:var(--mu, #5a6480);
    margin:12px 0 0;
    cursor:pointer;
  }

  .login-link span{
    color:var(--teal, #23B8A6);
    font-weight:900;
  }

  .login-sep{
    display:flex;
    align-items:center;
    gap:12px;
    color:var(--di, #9aa0b4);
    font-size:11px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.08em;
    margin:16px 0;
  }

  .login-sep::before,
  .login-sep::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--bd, rgba(0,0,0,.08));
  }

  .login-footer{
    margin-top:16px;
    text-align:center;
    color:var(--di, #9aa0b4);
    font-size:11px;
    line-height:1.4;
  }

  .uq-public-home,
  .uq-auth-shell{
    width:100%;
  }

  #login-screen.uq-show-auth .uq-public-home{
    display:none;
  }

  #login-screen.uq-show-auth .uq-auth-shell{
    display:flex;
  }

  #login-screen:not(.uq-show-auth) .uq-auth-shell{
    display:none;
  }

  @media(max-width:720px){
    .uq-public-wrap{width:min(100% - 28px, 1120px)}
    .uq-public-navbar{height:64px}
    .uq-nav-links{display:none}
    .uq-access-btn{height:36px;padding:0 13px}
    .uq-hero{min-height:calc(100vh - 64px);padding:28px 0 74px}
    .uq-hero-text{font-size:14px}
    .uq-login-card{padding:22px;border-radius:22px}
    .uq-auth-top{height:64px}
  }
</style>

<script id="uq-landing-login-patch-js">
(function(){
  function googleIcon(){
    return `
      <svg width="17" height="17" viewBox="0 0 18 18" aria-hidden="true">
        <path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 002.38-5.88c0-.57-.05-.66-.15-1.17z"></path>
        <path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 01-7.18-2.54H1.83v2.07A8 8 0 008.98 17z"></path>
        <path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 010-3.04V5.41H1.83a8 8 0 000 7.18l2.67-2.07z"></path>
        <path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 001.83 5.4L4.5 7.49a4.77 4.77 0 014.48-3.3z"></path>
      </svg>`;
  }

  function setTabFallback(tab){
    document.querySelectorAll(".login-tab-content").forEach(el => {
      el.style.display = "none";
    });
    const content = document.getElementById("lt-" + tab);
    if (content) content.style.display = "block";

    document.querySelectorAll(".login-tab-btn").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.tab === tab);
    });
  }

  window.goHomeLanding = function(){
    const screen = document.getElementById("login-screen");
    if (!screen) return;
    screen.classList.remove("uq-show-auth");
  };

  window.showAuth = function(tab){
    const screen = document.getElementById("login-screen");
    if (!screen) return;
    screen.classList.add("uq-show-auth");
    const nextTab = tab || "login";
    if (typeof window.setLoginTab === "function") {
      window.setLoginTab(nextTab);
    } else {
      setTabFallback(nextTab);
    }
  };

  function renderPublicLogin(){
    const screen = document.getElementById("login-screen");
    if (!screen || screen.dataset.uqPatched === "1") return;

    screen.dataset.uqPatched = "1";
    screen.classList.add("uq-public-screen");

    screen.innerHTML = `
      <section class="uq-public-home" aria-label="Página inicial do Um Quarto">
        <div class="uq-public-wrap">
          <header class="uq-public-navbar">
            <button class="uq-brand" type="button" onclick="goHomeLanding()" aria-label="Voltar para a página inicial">
              <span class="uq-brand-dot"></span>
              Um <span>Quarto</span>
            </button>

            <nav class="uq-nav-links" aria-label="Navegação principal">
              <a class="uq-nav-link" href="#inicio">Início</a>
              <a class="uq-nav-link" href="#como-funciona">Como funciona</a>
              <a class="uq-nav-link" href="#acesso" onclick="showAuth('login');return false;">Acesso</a>
            </nav>

            <button class="uq-access-btn" type="button" onclick="showAuth('login')">Acessar</button>
          </header>

          <main class="uq-hero" id="inicio">
            <div class="uq-hero-inner">
              <div class="uq-eyebrow">15 minutos por dia</div>
              <h1 class="uq-logo-title">Um <span>Quarto</span></h1>
              <h2 class="uq-hero-subtitle">Aprenda com foco.</h2>
              <p class="uq-hero-text">
                Um espaço simples para organizar estudos, tarefas e rotina sem poluir a tela.
              </p>
              <button class="uq-main-cta" type="button" onclick="showAuth('cadastro')">
                Registre agora
              </button>
            </div>
          </main>
        </div>

        <div class="uq-student-note">
          Boa noite, estudante. Entre quando estiver pronto para continuar seus estudos.
        </div>
      </section>

      <section class="uq-auth-shell" id="acesso" aria-label="Acesso ao Um Quarto">
        <div class="uq-public-wrap">
          <header class="uq-auth-top">
            <button class="uq-brand" type="button" onclick="goHomeLanding()" aria-label="Voltar para a página inicial">
              <span class="uq-brand-dot"></span>
              Um <span>Quarto</span>
            </button>

            <button class="uq-access-btn" type="button" onclick="goHomeLanding()">Página inicial</button>
          </header>

          <main class="uq-auth-body">
            <div class="uq-login-card">
              <div class="uq-login-title">Acesse sua conta</div>
              <div class="uq-login-sub">Continue seus estudos com seus dados salvos.</div>

              <div class="login-tabs">
                <button class="login-tab-btn active" data-tab="login" onclick="setLoginTab('login')">Entrar</button>
                <button class="login-tab-btn" data-tab="cadastro" onclick="setLoginTab('cadastro')">Cadastrar</button>
                <button class="login-tab-btn" data-tab="recuperar" onclick="setLoginTab('recuperar')">Recuperar</button>
              </div>

              <div class="login-tab-content" id="lt-login">
                <div class="login-input-wrap">
                  <span class="login-input-icon">✉️</span>
                  <input class="login-input" type="email" id="login-email" placeholder="seu@email.com" onkeydown="if(event.key==='Enter')loginEmail()">
                </div>
                <div class="login-input-wrap">
                  <span class="login-input-icon">🔒</span>
                  <input class="login-input" type="password" id="login-senha" placeholder="Senha" onkeydown="if(event.key==='Enter')loginEmail()">
                </div>
                <button id="btn-entrar" class="login-btn-action" style="background:var(--teal);color:#0c0e14;border-color:var(--teal)" onclick="loginEmail()">
                  Entrar
                </button>

                <div class="login-link" onclick="setLoginTab('recuperar')">Esqueceu a senha? <span>Recuperar</span></div>
                <div class="login-sep">ou</div>

                <button class="login-btn-google" onclick="loginGoogle()">
                  ${googleIcon()}
                  Entrar com Google
                </button>

                <div class="login-link" onclick="setLoginTab('cadastro')">Não tem conta? <span>Cadastre-se</span></div>
              </div>

              <div class="login-tab-content" id="lt-cadastro" style="display:none">
                <div class="login-input-wrap">
                  <span class="login-input-icon">👤</span>
                  <input class="login-input" type="text" id="cad-nome" placeholder="Seu nome">
                </div>
                <div class="login-input-wrap">
                  <span class="login-input-icon">✉️</span>
                  <input class="login-input" type="email" id="cad-email" placeholder="seu@email.com">
                </div>
                <div class="login-input-wrap">
                  <span class="login-input-icon">🔒</span>
                  <input class="login-input" type="password" id="cad-senha" placeholder="Senha">
                </div>
                <div class="login-input-wrap">
                  <span class="login-input-icon">✅</span>
                  <input class="login-input" type="password" id="cad-conf" placeholder="Confirmar senha" onkeydown="if(event.key==='Enter')cadastrarEmail()">
                </div>
                <button id="btn-cadastrar" class="login-btn-action" style="background:var(--teal);color:#0c0e14;border-color:var(--teal)" onclick="cadastrarEmail()">
                  Criar conta
                </button>
                <div class="login-link" onclick="setLoginTab('login')">Já tem conta? <span>Entrar</span></div>
              </div>

              <div class="login-tab-content" id="lt-recuperar" style="display:none">
                <div style="font-size:12px;color:var(--mu);margin-bottom:14px;text-align:center">
                  Digite seu email para receber o link de recuperação.
                </div>
                <div class="login-input-wrap">
                  <span class="login-input-icon">✉️</span>
                  <input class="login-input" type="email" id="rec-email" placeholder="seu@email.com" onkeydown="if(event.key==='Enter')recuperarSenha()">
                </div>
                <button id="btn-recuperar" class="login-btn-action" style="background:var(--purple);color:#fff;border-color:var(--purple)" onclick="recuperarSenha()">
                  Enviar recuperação
                </button>
                <div class="login-link" onclick="setLoginTab('login')">Voltar para o <span>login</span></div>
              </div>

              <div class="login-footer">
                Seus dados ficam protegidos na sua conta.
              </div>
            </div>
          </main>
        </div>
      </section>
    `;

    if (typeof window.setLoginTab !== "function") {
      window.setLoginTab = setTabFallback;
    } else {
      window.setLoginTab("login");
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", renderPublicLogin);
  } else {
    renderPublicLogin();
  }
})();
</script>
